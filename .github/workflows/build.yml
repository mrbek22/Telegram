name: Build APK

# Qo'lda ishga tushirish (Actions sahifasidan "Run workflow") yoki master'ga push bo'lganda
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'PLAN.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bo'sh disk joyini oshirish
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: NDK va CMake o'rnatish
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2.4988404"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: gradlew ruxsat
        run: chmod +x ./gradlew

      - name: API kalitlarini kiritish (secret bo'lsa)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          BV=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            sed -i "s/public static int APP_ID = .*;/public static int APP_ID = ${TG_API_ID};/" "$BV"
            sed -i "s/public static String APP_HASH = \"[^\"]*\";/public static String APP_HASH = \"${TG_API_HASH}\";/" "$BV"
            echo "✓ Shaxsiy API kaliti kiritildi (APP_ID=${TG_API_ID})."
          else
            echo "! TG_API_ID/TG_API_HASH secret yo'q — test API (APP_ID=4) ishlatiladi."
          fi

      - name: Keystore tayyorlash (secret bo'lsa)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "custom=true" >> "$GITHUB_OUTPUT"
            echo "✓ Shaxsiy keystore o'rnatildi."
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "! Repo standart keystore ishlatiladi."
          fi

      - name: Standalone APK build
        env:
          RSP: ${{ secrets.KEYSTORE_PASSWORD }}
          RKA: ${{ secrets.KEY_ALIAS }}
          RKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.custom }}" = "true" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
              -PRELEASE_STORE_PASSWORD="$RSP" -PRELEASE_KEY_ALIAS="$RKA" -PRELEASE_KEY_PASSWORD="$RKP" \
              --stacktrace --no-daemon
          else
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace --no-daemon
          fi

      - name: APK'ni topish
        id: apk
        run: |
          APK=$(find TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK topildi: $APK"
          ls -lh "$APK"

      - name: APK'ni yuklash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
